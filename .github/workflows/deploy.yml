name: Deploy VimPracticeOnWeb to GitHub Pages                                                            
                                                                                                             
    # main 브랜치 푸시 또는 GitHub 콘솔에서 수동 실행(workflow_dispatch) 시 배포 파이프라인 트리거           
    on:                                                                                                      
      push:                                                                                                  
        branches:                                                                                            
          - main                                                                                             
      workflow_dispatch:                                                                                     
                                                                                                             
    # GitHub Pages 배포 및 OIDC 토큰 발급에 필요한 최소 권한 설정                                            
    permissions:                                                                                             
      contents: read                                                                                         
      pages: write                                                                                           
      id-token: write                                                                                        
                                                                                                             
    # 여러 배포 작업이 동시에 실행되어 충돌하는 것을 방지하는 동시성 제어                                    
    concurrency:                                                                                             
      group: 'pages'                                                                                         
      cancel-in-progress: false                                                                              
                                                                                                             
    jobs:                                                                                                    
      # 1. 빌드 및 테스트 잡 (Build & Test Job)                                                              
      build:                                                                                                 
        runs-on: ubuntu-latest                                                                               
        steps:                                                                                               
          - name: 소스코드 체크아웃                                                                          
            uses: actions/checkout@v4                                                                        
                                                                                                             
          - name: Node.js 20 환경 설정 및 npm 캐시 활성화                                                    
            uses: actions/setup-node@v4                                                                      
            with:                                                                                            
              node-version: 20                                                                               
              cache: 'npm'                                                                                   
                                                                                                             
          - name: 의존성 패키지 클린 설치 (npm ci)                                                           
            run: npm ci                                                                                      
                                                                                                             
          - name: Vitest 전체 테스트 검증 (npm run test -- --run)                                            
            run: npm run test -- --run                                                                       
                                                                                                             
          - name: 프로덕션 번들 빌드 (npm run build)                                                         
            run: npm run build                                                                               
                                                                                                             
          - name: GitHub Pages 환경 설정 구성                                                                
            uses: actions/configure-pages@v5                                                                 
                                                                                                             
          - name: 빌드 결과물(dist) Pages 아티팩트로 업로드                                                  
            uses: actions/upload-pages-artifact@v3                                                           
            with:                                                                                            
              path: './dist'                                                                                 
                                                                                                             
      # 2. 배포 잡 (Deploy Job)                                                                              
      deploy:                                                                                                
        environment:                                                                                         
          name: github-pages                                                                                 
          url: ${{ steps.deployment.outputs.page_url }}                                                      
        runs-on: ubuntu-latest                                                                               
        needs: build                                                                                         
        steps:                                                                                               
          - name: GitHub Pages 정적 사이트 배포 실행                                                         
            id: deployment                                                                                   
            uses: actions/deploy-pages@v4 
